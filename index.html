<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESKKIT — Ish stoli aksessuarlari</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #EDEFF2;
    --bg-panel: #FFFFFF;
    --ink: #14181F;
    --ink-soft: #565E6B;
    --line: #D5DAE1;
    --accent: #0E7C7B;
    --accent-ink: #FFFFFF;
    --warn: #B5502E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    border: 2px solid var(--ink);
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    top: 5px; left: 5px; right: 5px; bottom: 5px;
    background: var(--accent);
  }

  .cart-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    cursor: default;
  }
  .cart-pill .count {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 999px;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }

  .hero {
    padding: 56px 40px 40px;
    max-width: 720px;
  }
  .hero h1 {
    font-size: 42px;
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
  }
  .hero h1 span {
    color: var(--accent);
  }
  .hero p {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    max-width: 60ch;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 0;
    align-items: start;
    padding: 0 40px 60px;
  }

  .catalog {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    padding-right: 32px;
  }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card .glyph {
    width: 40px; height: 40px;
    border: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .card h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
  }

  .card .specs {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  .card .price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .qty-control {
    display: flex;
    align-items: center;
    border: 1px solid var(--ink);
  }
  .qty-control button {
    background: none;
    border: none;
    width: 28px; height: 28px;
    font-size: 16px;
    cursor: pointer;
    color: var(--ink);
  }
  .qty-control button:hover { background: var(--bg); }
  .qty-control span {
    width: 26px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .add-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 8px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .add-btn:hover { background: var(--accent); }
  .add-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .out-tag {
    font-size: 12px;
    color: var(--warn);
    font-family: 'JetBrains Mono', monospace;
  }

  /* CART PANEL */
  aside {
    position: sticky;
    top: 20px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  aside h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .cart-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 40px;
  }

  .cart-empty {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 12px 0;
  }

  .cart-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    gap: 8px;
  }
  .cart-row .name {
    flex: 1;
  }
  .cart-row .amt {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-soft);
  }
  .cart-row button {
    background: none;
    border: none;
    color: var(--warn);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .discount-row {
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .discount-row input {
    flex: 1;
    border: 1px solid var(--line);
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--bg);
  }
  .discount-row button {
    border: 1px solid var(--ink);
    background: none;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .discount-msg {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    min-height: 14px;
  }
  .discount-msg.ok { color: var(--accent); }
  .discount-msg.bad { color: var(--warn); }

  .totals {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .totals .line {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .totals .final {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: 700;
    padding-top: 6px;
  }
  .totals .final .mono { font-family: 'JetBrains Mono', monospace; }

  .checkout-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .checkout-btn:hover { opacity: 0.9; }
  .checkout-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  /* RECEIPT MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,24,31,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  .receipt {
    background: #fff;
    width: 380px;
    max-width: 100%;
    padding: 28px;
    border: 1px solid var(--ink);
  }
  .receipt h3 {
    margin: 0 0 4px;
    font-size: 18px;
  }
  .receipt .sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .receipt .rline {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }
  .receipt .rtotal {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    padding-top: 14px;
    margin-top: 6px;
  }
  .receipt .close-btn {
    margin-top: 20px;
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    cursor: pointer;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .catalog { grid-template-columns: 1fr; padding-right: 0; margin-bottom: 24px; }
    aside { position: static; }
    header, .hero, main { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    DESKKIT
  </div>
  <div class="cart-pill">
    <span>Savat</span>
    <span class="count mono" id="cart-count">0</span>
  </div>
</header>

<div class="hero">
  <h1>Ish stolingiz uchun <span>hammasi bir joyda.</span></h1>
  <p>Noutbuk aksessuarlaridan tortib, ish stoli yoritgichigacha — talabalar va dasturchilar uchun tanlangan jihozlar.</p>
</div>

<main>
  <div class="catalog" id="catalog"></div>

  <aside>
    <h2>Savat</h2>
    <div class="cart-list" id="cart-list">
      <div class="cart-empty">Savat hozircha bo'sh.</div>
    </div>

    <div class="discount-row">
      <input type="text" id="discount-input" placeholder="Chegirma kodi" class="mono">
      <button id="discount-apply">Qo'llash</button>
    </div>
    <div class="discount-msg" id="discount-msg"></div>

    <div class="totals">
      <div class="line"><span>Jami</span><span class="mono" id="subtotal">0 so'm</span></div>
      <div class="line" id="discount-line" style="display:none;"><span>Chegirma</span><span class="mono" id="discount-amt">−0</span></div>
      <div class="final"><span>To'lanadi</span><span class="mono" id="grand-total">0 so'm</span></div>
    </div>

    <button class="checkout-btn" id="checkout-btn" disabled>To'lovni yakunlash</button>
  </aside>
</main>

<div class="overlay" id="overlay">
  <div class="receipt">
    <h3>Buyurtma qabul qilindi</h3>
    <div class="sub">Chek raqami: <span class="mono" id="order-id"></span></div>
    <div id="receipt-lines"></div>
    <div class="rtotal"><span>Jami to'landi</span><span class="mono" id="receipt-total"></span></div>
    <button class="close-btn" id="close-receipt">Yopish</button>
  </div>
</div>

<script>
  const PRODUCTS = [
    { id: 'p1', name: 'Noutbuk sumkasi', glyph: '▤', price: 120000, stock: 10 },
    { id: 'p2', name: 'USB flash 32GB',   glyph: '▮', price: 45000,  stock: 20 },
    { id: 'p3', name: 'Simsiz sichqoncha', glyph: '◐', price: 85000,  stock: 15 },
    { id: 'p4', name: 'Klaviatura',        glyph: '▦', price: 150000, stock: 8  },
    { id: 'p5', name: 'Ish stoli lampasi', glyph: '☀', price: 60000,  stock: 12 },
  ];

  const DISCOUNTS = {
    'STUDENT10': 0.10,
    'FIRST20': 0.20,
  };

  const cart = {}; // id -> qty
  let appliedDiscount = 0;
  let appliedCode = '';

  const fmt = n => n.toLocaleString('uz-UZ') + ' so\'m';

  function stockRemaining(p) {
    return p.stock - (cart[p.id] || 0);
  }

  function renderCatalog() {
    const el = document.getElementById('catalog');
    el.innerHTML = PRODUCTS.map(p => {
      const remaining = stockRemaining(p);
      const qty = cart[p.id] || 0;
      return `
        <div class="card">
          <div class="glyph">${p.glyph}</div>
          <h3>${p.name}</h3>
          <div class="specs"><span>Omborda</span><span>${remaining} dona</span></div>
          <div class="stepper">
            <span class="price">${fmt(p.price)}</span>
            ${remaining <= 0 && qty === 0
              ? '<span class="out-tag">Tugagan</span>'
              : `<div class="qty-control">
                   <button onclick="changeQty('${p.id}', -1)" ${qty === 0 ? 'disabled' : ''}>−</button>
                   <span>${qty}</span>
                   <button onclick="changeQty('${p.id}', 1)" ${remaining === 0 ? 'disabled' : ''}>+</button>
                 </div>`
            }
          </div>
        </div>
      `;
    }).join('');
  }

  function changeQty(id, delta) {
    const p = PRODUCTS.find(x => x.id === id);
    const current = cart[id] || 0;
    const next = current + delta;
    if (next < 0) return;
    if (delta > 0 && stockRemaining(p) <= 0) return;
    if (next === 0) delete cart[id]; else cart[id] = next;
    renderAll();
  }

  function subtotal() {
    return Object.entries(cart).reduce((sum, [id, qty]) => {
      const p = PRODUCTS.find(x => x.id === id);
      return sum + p.price * qty;
    }, 0);
  }

  function renderCart() {
    const list = document.getElementById('cart-list');
    const entries = Object.entries(cart);
    const countEl = document.getElementById('cart-count');
    countEl.textContent = entries.reduce((s, [, q]) => s + q, 0);

    if (entries.length === 0) {
      list.innerHTML = '<div class="cart-empty">Savat hozircha bo\'sh.</div>';
    } else {
      list.innerHTML = entries.map(([id, qty]) => {
        const p = PRODUCTS.find(x => x.id === id);
        return `
          <div class="cart-row">
            <span class="name">${p.name} × ${qty}</span>
            <span class="amt">${fmt(p.price * qty)}</span>
            <button onclick="changeQty('${id}', -${qty})">olib tashlash</button>
          </div>
        `;
      }).join('');
    }

    const sub = subtotal();
    document.getElementById('subtotal').textContent = fmt(sub);

    const discountAmt = Math.round(sub * appliedDiscount);
    const discountLine = document.getElementById('discount-line');
    if (appliedDiscount > 0) {
      discountLine.style.display = 'flex';
      document.getElementById('discount-amt').textContent = '−' + fmt(discountAmt);
    } else {
      discountLine.style.display = 'none';
    }

    const total = sub - discountAmt;
    document.getElementById('grand-total').textContent = fmt(total);

    document.getElementById('checkout-btn').disabled = entries.length === 0;
  }

  function renderAll() {
    renderCatalog();
    renderCart();
  }

  document.getElementById('discount-apply').addEventListener('click', () => {
    const input = document.getElementById('discount-input');
    const code = input.value.trim().toUpperCase();
    const msg = document.getElementById('discount-msg');
    if (!code) return;
    if (DISCOUNTS[code]) {
      appliedDiscount = DISCOUNTS[code];
      appliedCode = code;
      msg.textContent = `Qo'llandi: −${appliedDiscount * 100}%`;
      msg.className = 'discount-msg ok';
    } else {
      appliedDiscount = 0;
      appliedCode = '';
      msg.textContent = 'Bunday kod topilmadi.';
      msg.className = 'discount-msg bad';
    }
    renderCart();
  });

  document.getElementById('checkout-btn').addEventListener('click', () => {
    const sub = subtotal();
    const discountAmt = Math.round(sub * appliedDiscount);
    const total = sub - discountAmt;

    const lines = Object.entries(cart).map(([id, qty]) => {
      const p = PRODUCTS.find(x => x.id === id);
      return `<div class="rline"><span>${p.name} × ${qty}</span><span>${fmt(p.price * qty)}</span></div>`;
    }).join('');

    document.getElementById('receipt-lines').innerHTML = lines +
      (appliedDiscount > 0 ? `<div class="rline"><span>Chegirma (${appliedCode})</span><span>−${fmt(discountAmt)}</span></div>` : '');
    document.getElementById('receipt-total').textContent = fmt(total);
    document.getElementById('order-id').textContent = 'DK-' + Math.floor(100000 + Math.random() * 900000);

    document.getElementById('overlay').classList.add('show');

    // reset cart
    for (const id in cart) delete cart[id];
    appliedDiscount = 0;
    appliedCode = '';
    document.getElementById('discount-input').value = '';
    document.getElementById('discount-msg').textContent = '';
    renderAll();
  });

  document.getElementById('close-receipt').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('show');
  });

  renderAll();
</script>

</body>
</html>
