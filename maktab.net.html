<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILS — Maktab.net</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #09090b;
            min-height: 100vh;
            color: #e8edf5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .app {
            width: 100%;
            max-width: 1300px;
            background: #14171c;
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }
        /* top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo-icon {
            font-size: 2rem;
            color: #3b82f6;
            background: #1e293b;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.6);
        }
        .logo-text {
            font-weight: 800;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e0e7ff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-sub {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-left: 0.3rem;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-badge {
            background: #1e232b;
            padding: 0.6rem 1.4rem 0.6rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            border: 1px solid #2d333c;
            font-weight: 500;
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .user-badge i {
            color: #3b82f6;
        }
        .user-badge .role-tag {
            font-size: 0.6rem;
            background: #3b82f633;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            color: #60a5fa;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid #3d4450;
            color: #94a3b8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-logout:hover {
            background: #2d333c;
            border-color: #64748b;
            color: #f1f5f9;
        }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-secondary:hover {
            background: #2d333c;
            border-color: #64748b;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 6px 16px -6px #3b82f666;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.01);
        }
        .btn-danger {
            background: #dc2626;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-sm {
            padding: 0.3rem 0.9rem;
            font-size: 0.75rem;
        }
        /* login */
        .login-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 2rem;
        }
        .login-box {
            background: #1a1f26;
            padding: 2.8rem 3rem;
            border-radius: 2.5rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a303a;
            box-shadow: 0 20px 40px -16px #00000066;
        }
        .login-box h2 {
            font-weight: 700;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.3rem;
        }
        .login-box h2 i {
            color: #3b82f6;
        }
        .login-sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.8rem;
        }
        .input-group {
            margin-bottom: 1.4rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        .input-wrap {
            display: flex;
            align-items: center;
            background: #0f1218;
            border-radius: 60px;
            border: 1px solid #2a303a;
            transition: 0.2s;
            padding: 0 1.2rem;
        }
        .input-wrap:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #3b82f633;
        }
        .input-wrap i {
            color: #64748b;
            margin-right: 0.7rem;
        }
        .input-wrap input,
        .input-wrap select {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.9rem 0;
            font-size: 1rem;
            color: #f1f5f9;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .input-wrap select option {
            background: #1a1f26;
            color: #f1f5f9;
        }
        .login-error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            text-align: center;
            min-height: 1.6rem;
        }
        /* dashboard */
        .dashboard {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
        }
        .page-header h1 span {
            color: #3b82f6;
        }
        .page-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            gap: 0.3rem;
            background: #1a1f26;
            padding: 0.3rem;
            border-radius: 60px;
            border: 1px solid #2a303a;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px -4px #3b82f666;
        }
        .tab-btn:hover:not(.active) {
            color: #e8edf5;
            background: #2d333c;
        }
        .tab-content {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: #1a1f26;
            border-radius: 1.8rem;
            padding: 1.8rem;
            border: 1px solid #252c36;
            margin-bottom: 1.5rem;
        }
        .card h3 {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .card h3 i {
            color: #3b82f6;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 1.5rem;
            }
            .login-box {
                padding: 2rem 1.5rem;
            }
        }
        .group-list,
        .student-list,
        .question-list {
            list-style: none;
        }
        .group-list li,
        .student-list li,
        .question-list li {
            background: #0f1218;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid #252c36;
        }
        .group-list li .group-info,
        .student-list li .student-info {
            display: flex;
            flex-direction: column;
        }
        .group-list li .group-name {
            font-weight: 600;
        }
        .group-list li .group-desc {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .student-list li .student-name {
            font-weight: 500;
        }
        .student-list li .student-login {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .badge {
            background: #1e293b;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid #2d333c;
        }
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #64748b;
        }
        .empty-state i {
            font-size: 2.5rem;
            color: #2d333c;
            margin-bottom: 0.8rem;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1a1f26;
            border-radius: 2rem;
            padding: 2rem 2.5rem;
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a303a;
            box-shadow: 0 30px 60px -20px #000;
        }
        .modal-box h3 {
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .modal-box h3 i {
            color: #3b82f6;
        }
        .modal-box .input-group {
            margin-bottom: 1rem;
        }
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
            justify-content: flex-end;
        }
        .score-input {
            width: 70px;
            background: #0f1218;
            border: 1px solid #2a303a;
            border-radius: 40px;
            padding: 0.3rem 0.6rem;
            color: #f1f5f9;
            font-size: 0.9rem;
            text-align: center;
        }
        .score-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .student-score {
            font-weight: 600;
            color: #3b82f6;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .text-sm {
            font-size: 0.8rem;
        }
        .fw-600 {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <span class="logo-text">ILS</span>
            <span class="logo-sub">IT Live Score</span>
        </div>
        <div class="top-actions" id="topActions"></div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="login-overlay">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> Kirish</h2>
            <div class="login-sub">O‘quv markaz platformasiga kirish</div>
            <div class="input-group">
                <label>Login</label>
                <div class="input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Loginingizni kiriting" />
                </div>
            </div>
            <div class="input-group">
                <label>Parol</label>
                <div class="input-wrap">
                    <i class="fas fa-key"></i>
                    <input type="password" id="loginPassword" placeholder="Parol" />
                </div>
            </div>
            <button class="btn-primary" id="loginBtn" style="width:100%;justify-content:center;">
                <i class="fas fa-arrow-right-to-bracket"></i> Kirish
            </button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardView" class="dashboard">
        <div class="page-header">
            <div>
                <h1>Assalomu alaykum, <span id="greetUser">Iroda</span></h1>
                <p id="userRoleDisplay" class="text-muted">Admin</p>
            </div>
            <div style="display:flex;gap:0.6rem;align-items:center;">
                <span style="background:#23282f;padding:0.3rem 1rem;border-radius:60px;font-size:0.75rem;border:1px solid #2d333c;">
                    <i class="fas fa-circle" style="color:#34d399;font-size:0.5rem;margin-right:6px;"></i> tizimda
                </span>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="groups"><i class="fas fa-layer-group"></i> Guruhlar</button>
            <button class="tab-btn" data-tab="students"><i class="fas fa-users"></i> O‘quvchilar</button>
            <button class="tab-btn" data-tab="questions"><i class="fas fa-question-circle"></i> Savollar</button>
            <button class="tab-btn" data-tab="scores"><i class="fas fa-star"></i> Ballar</button>
        </div>

        <!-- TAB: GROUPS -->
        <div class="tab-content active" id="tabGroups">
            <div class="flex-between mb-1">
                <h3><i class="fas fa-layer-group"></i> Guruhlar</h3>
                <button class="btn-primary btn-sm" id="btnAddGroup"><i class="fas fa-plus"></i> Guruh qo‘shish</button>
            </div>
            <div class="card">
                <ul class="group-list" id="groupList"></ul>
            </div>
        </div>

        <!-- TAB: STUDENTS -->
        <div class="tab-content" id="tabStudents">
            <div class="flex-between mb-1">
                <h3><i class="fas fa-users"></i> O‘quvchilar</h3>
                <button class="btn-primary btn-sm" id="btnAddStudent"><i class="fas fa-user-plus"></i> O‘quvchi qo‘shish</button>
            </div>
            <div class="card">
                <ul class="student-list" id="studentList"></ul>
            </div>
        </div>

        <!-- TAB: QUESTIONS -->
        <div class="tab-content" id="tabQuestions">
            <div class="flex-between mb-1">
                <h3><i class="fas fa-question-circle"></i> Savollar</h3>
                <button class="btn-primary btn-sm" id="btnAddQuestion"><i class="fas fa-plus"></i> Savol qo‘shish</button>
            </div>
            <div class="card">
                <ul class="question-list" id="questionList"></ul>
            </div>
        </div>

        <!-- TAB: SCORES -->
        <div class="tab-content" id="tabScores">
            <h3><i class="fas fa-star"></i> Ballar</h3>
            <div class="card" id="scoreBoard">
                <p class="text-muted">Ballar jadvali</p>
                <div id="scoreTable"></div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> Yangi</h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modalCancel">Bekor qilish</button>
                <button class="btn-primary" id="modalSave"><i class="fas fa-check"></i> Saqlash</button>
            </div>
        </div>
    </div>

</div>

<script>
    (function() {
        // ─── CONSTANTS ──────────────────────────────────────
        const ADMIN_USERNAME = 'Iroda';
        const ADMIN_PASSWORD = '009900';

        // ─── DATA LAYER (localStorage) ─────────────────────
        function getData() {
            try {
                return JSON.parse(localStorage.getItem('ils_data')) || {
                    groups: [],
                    students: [],
                    questions: [],
                    scores: {} // { studentId: { questionId: score } }
                };
            } catch { return { groups: [], students: [], questions: [], scores: {} }; }
        }

        function saveData(data) {
            localStorage.setItem('ils_data', JSON.stringify(data));
        }

        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        // ─── STATE ──────────────────────────────────────────
        let currentUser = null; // { username, role: 'admin'|'student', id? }
        let data = getData();

        // ─── DOM REFS ──────────────────────────────────────
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const topActions = document.getElementById('topActions');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const greetUser = document.getElementById('greetUser');
        const userRoleDisplay = document.getElementById('userRoleDisplay');

        const tabContainer = document.getElementById('tabContainer');
        const tabContents = {
            groups: document.getElementById('tabGroups'),
            students: document.getElementById('tabStudents'),
            questions: document.getElementById('tabQuestions'),
            scores: document.getElementById('tabScores')
        };
        const groupList = document.getElementById('groupList');
        const studentList = document.getElementById('studentList');
        const questionList = document.getElementById('questionList');
        const scoreTable = document.getElementById('scoreTable');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');

        let modalContext = {}; // { mode, callback, extra }

        // ─── RENDER FUNCTIONS ──────────────────────────────

        function renderGroups() {
            if (!data.groups.length) {
                groupList.innerHTML = `<div class="empty-state"><i class="fas fa-layer-group"></i><p>Hozircha guruh yo‘q</p></div>`;
                return;
            }
            groupList.innerHTML = data.groups.map(g => `
                <li>
                    <div class="group-info">
                        <span class="group-name">${g.name}</span>
                        <span class="group-desc">${g.desc || 'Tavsif yo‘q'}</span>
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        <span class="badge">${g.studentIds ? g.studentIds.length : 0} o‘quvchi</span>
                        <button class="btn-danger btn-sm" data-action="deleteGroup" data-id="${g.id}"><i class="fas fa-trash"></i></button>
                    </div>
                </li>
            `).join('');
            // delete handlers
            groupList.querySelectorAll('[data-action="deleteGroup"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('Guruhni oʻchirish?')) {
                        const id = btn.dataset.id;
                        data.groups = data.groups.filter(g => g.id !== id);
                        // remove students in this group?
                        data.students = data.students.filter(s => s.groupId !== id);
                        saveData(data);
                        renderAll();
                    }
                });
            });
        }

        function renderStudents() {
            const students = data.students;
            if (!students.length) {
                studentList.innerHTML = `<div class="empty-state"><i class="fas fa-users"></i><p>Hozircha o‘quvchi yo‘q</p></div>`;
                return;
            }
            studentList.innerHTML = students.map(s => {
                const group = data.groups.find(g => g.id === s.groupId);
                return `
                    <li>
                        <div class="student-info">
                            <span class="student-name">${s.name}</span>
                            <span class="student-login">Login: ${s.login} | Guruh: ${group ? group.name : '—'}</span>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <span class="badge">${s.password}</span>
                            <button class="btn-danger btn-sm" data-action="deleteStudent" data-id="${s.id}"><i class="fas fa-trash"></i></button>
                        </div>
                    </li>
                `;
            }).join('');
            studentList.querySelectorAll('[data-action="deleteStudent"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('Oʻquvchini oʻchirish?')) {
                        const id = btn.dataset.id;
                        data.students = data.students.filter(s => s.id !== id);
                        // remove scores
                        delete data.scores[id];
                        saveData(data);
                        renderAll();
                    }
                });
            });
        }

        function renderQuestions() {
            if (!data.questions.length) {
                questionList.innerHTML = `<div class="empty-state"><i class="fas fa-question-circle"></i><p>Hozircha savol yo‘q</p></div>`;
                return;
            }
            questionList.innerHTML = data.questions.map(q => `
                <li>
                    <div>
                        <span class="fw-600">${q.text}</span>
                        <span class="text-muted text-sm" style="margin-left:0.8rem;">Maks: ${q.maxScore}</span>
                        <span class="badge" style="margin-left:0.5rem;">${q.groupId ? data.groups.find(g=>g.id===q.groupId)?.name || '—' : 'Barcha'}</span>
                    </div>
                    <button class="btn-danger btn-sm" data-action="deleteQuestion" data-id="${q.id}"><i class="fas fa-trash"></i></button>
                </li>
            `).join('');
            questionList.querySelectorAll('[data-action="deleteQuestion"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('Savolni oʻchirish?')) {
                        const id = btn.dataset.id;
                        data.questions = data.questions.filter(q => q.id !== id);
                        // remove scores for this question
                        for (let sid in data.scores) {
                            delete data.scores[sid][id];
                        }
                        saveData(data);
                        renderAll();
                    }
                });
            });
        }

        function renderScores() {
            if (!data.students.length || !data.questions.length) {
                scoreTable.innerHTML = `<div class="empty-state"><i class="fas fa-star"></i><p>Ballar ko‘rsatish uchun o‘quvchi va savollar bo‘lishi kerak</p></div>`;
                return;
            }
            let html = `<table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
                <thead><tr style="border-bottom:1px solid #2a303a;">
                    <th style="text-align:left;padding:0.5rem 0.3rem;">O‘quvchi</th>
                    ${data.questions.map(q => `<th style="text-align:center;padding:0.5rem 0.3rem;">${q.text.slice(0,12)}</th>`).join('')}
                    <th style="text-align:center;padding:0.5rem 0.3rem;">Jami</th>
                </tr></thead><tbody>`;
            data.students.forEach(s => {
                const scores = data.scores[s.id] || {};
                let total = 0;
                html += `<tr style="border-bottom:1px solid #1e293b;">`;
                html += `<td style="padding:0.5rem 0.3rem;">${s.name}</td>`;
                data.questions.forEach(q => {
                    const val = scores[q.id] !== undefined ? scores[q.id] : '';
                    html += `<td style="text-align:center;padding:0.3rem;">
                        <input class="score-input" type="number" min="0" max="${q.maxScore}" 
                            data-student="${s.id}" data-question="${q.id}" value="${val}" 
                            placeholder="—" style="width:60px;" />
                    </td>`;
                    if (scores[q.id]) total += Number(scores[q.id]);
                });
                html += `<td style="text-align:center;padding:0.5rem 0.3rem;font-weight:700;color:#3b82f6;">${total}</td>`;
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            scoreTable.innerHTML = html;
            // auto-save on score change
            scoreTable.querySelectorAll('.score-input').forEach(inp => {
                inp.addEventListener('change', function() {
                    const studentId = this.dataset.student;
                    const questionId = this.dataset.question;
                    const val = parseFloat(this.value);
                    if (!data.scores[studentId]) data.scores[studentId] = {};
                    if (isNaN(val) || val < 0) {
                        delete data.scores[studentId][questionId];
                    } else {
                        const q = data.questions.find(q => q.id === questionId);
                        if (q && val <= q.maxScore) {
                            data.scores[studentId][questionId] = val;
                        } else {
                            alert(`Maksimal ball ${q ? q.maxScore : '?'} dan oshmasligi kerak`);
                            this.value = data.scores[studentId][questionId] || '';
                            return;
                        }
                    }
                    saveData(data);
                    renderScores(); // re-render to update totals
                });
            });
        }

        function renderAll() {
            renderGroups();
            renderStudents();
            renderQuestions();
            renderScores();
            updateTopBar();
        }

        // ─── TOP BAR ──────────────────────────────────────
        function updateTopBar() {
            topActions.innerHTML = '';
            if (!currentUser) return;
            const badge = document.createElement('div');
            badge.className = 'user-badge';
            badge.innerHTML = `
                <i class="fas fa-user-circle"></i> ${currentUser.username}
                <span class="role-tag">${currentUser.role === 'admin' ? 'Admin' : 'O‘quvchi'}</span>
            `;
            topActions.appendChild(badge);
            const logoutBtn = document.createElement('button');
            logoutBtn.className = 'btn-logout';
            logoutBtn.innerHTML = `<i class="fas fa-right-from-bracket"></i> Chiqish`;
            logoutBtn.addEventListener('click', logout);
            topActions.appendChild(logoutBtn);
        }

        // ─── LOGIN / LOGOUT ──────────────────────────────
        function login() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (!username || !password) {
                loginError.textContent = 'Iltimos, login va parolni kiriting.';
                return;
            }
            // admin
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                currentUser = { username, role: 'admin' };
                enterDashboard();
                return;
            }
            // student
            const student = data.students.find(s => s.login === username && s.password === password);
            if (student) {
                currentUser = { username, role: 'student', id: student.id };
                enterDashboard();
                return;
            }
            loginError.textContent = '❌ Noto‘g‘ri login yoki parol.';
        }

        function enterDashboard() {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            greetUser.textContent = currentUser.username;
            userRoleDisplay.textContent = currentUser.role === 'admin' ? 'Admin (O‘qituvchi)' : 'O‘quvchi';
            // show/hide tabs based on role
            const isAdmin = currentUser.role === 'admin';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const tab = btn.dataset.tab;
                if (!isAdmin && (tab === 'students' || tab === 'questions' || tab === 'scores')) {
                    btn.style.display = 'none';
                } else {
                    btn.style.display = 'inline-flex';
                }
            });
            // if student, show only groups tab
            if (!isAdmin) {
                // activate groups tab
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.tab-btn[data-tab="groups"]').classList.add('active');
                Object.values(tabContents).forEach(tc => tc.classList.remove('active'));
                tabContents.groups.classList.add('active');
                // filter groups for this student
            }
            renderAll();
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            updateTopBar();
        }

        function logout() {
            currentUser = null;
            loginView.style.display = 'flex';
            dashboardView.style.display = 'none';
            updateTopBar();
            loginUsername.focus();
        }

        // ─── TABS ──────────────────────────────────────────
        tabContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const tab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Object.values(tabContents).forEach(tc => tc.classList.remove('active'));
            if (tabContents[tab]) tabContents[tab].classList.add('active');
            // re-render tab content
            if (tab === 'groups') renderGroups();
            if (tab === 'students') renderStudents();
            if (tab === 'questions') renderQuestions();
            if (tab === 'scores') renderScores();
        });

        // ─── MODAL SYSTEM ──────────────────────────────────
        function openModal(title, bodyHTML, context) {
            modalTitle.innerHTML = title;
            modalBody.innerHTML = bodyHTML;
            modalContext = context || {};
            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            modalContext = {};
        }

        modalCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ─── MODAL: ADD GROUP ─────────────────────────────
        document.getElementById('btnAddGroup').addEventListener('click', () => {
            if (currentUser?.role !== 'admin') return;
            openModal(
                '<i class="fas fa-layer-group"></i> Yangi guruh',
                `
                <div class="input-group">
                    <label>Guruh nomi</label>
                    <div class="input-wrap"><i class="fas fa-tag"></i><input type="text" id="modalGroupName" placeholder="Masalan: Frontend 2026" /></div>
                </div>
                <div class="input-group">
                    <label>Tavsif (ixtiyoriy)</label>
                    <div class="input-wrap"><i class="fas fa-align-left"></i><input type="text" id="modalGroupDesc" placeholder="Qisqacha tavsif" /></div>
                </div>
                `,
                { mode: 'addGroup' }
            );
        });

        // ─── MODAL: ADD STUDENT ────────────────────────────
        document.getElementById('btnAddStudent').addEventListener('click', () => {
            if (currentUser?.role !== 'admin') return;
            const groupOpts = data.groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            openModal(
                '<i class="fas fa-user-plus"></i> O‘quvchi qo‘shish',
                `
                <div class="input-group">
                    <label>Ismi</label>
                    <div class="input-wrap"><i class="fas fa-user"></i><input type="text" id="modalStudentName" placeholder="To‘liq ismi" /></div>
                </div>
                <div class="input-group">
                    <label>Login</label>
                    <div class="input-wrap"><i class="fas fa-user-tag"></i><input type="text" id="modalStudentLogin" placeholder="Unikal login" /></div>
                </div>
                <div class="input-group">
                    <label>Parol</label>
                    <div class="input-wrap"><i class="fas fa-key"></i><input type="text" id="modalStudentPassword" placeholder="Parol" /></div>
                </div>
                <div class="input-group">
                    <label>Guruh</label>
                    <div class="input-wrap"><i class="fas fa-layer-group"></i>
                        <select id="modalStudentGroup">
                            <option value="">— Guruh tanlang —</option>
                            ${groupOpts}
                        </select>
                    </div>
                </div>
                `,
                { mode: 'addStudent' }
            );
        });

        // ─── MODAL: ADD QUESTION ───────────────────────────
        document.getElementById('btnAddQuestion').addEventListener('click', () => {
            if (currentUser?.role !== 'admin') return;
            const groupOpts = `<option value="">Barcha guruhlar</option>` +
                data.groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            openModal(
                '<i class="fas fa-question-circle"></i> Savol qo‘shish',
                `
                <div class="input-group">
                    <label>Savol matni</label>
                    <div class="input-wrap"><i class="fas fa-pen"></i><input type="text" id="modalQuestionText" placeholder="Savol matni" /></div>
                </div>
                <div class="input-group">
                    <label>Maksimal ball</label>
                    <div class="input-wrap"><i class="fas fa-star"></i><input type="number" id="modalQuestionMax" placeholder="10" value="10" /></div>
                </div>
                <div class="input-group">
                    <label>Guruh (ixtiyoriy)</label>
                    <div class="input-wrap"><i class="fas fa-layer-group"></i>
                        <select id="modalQuestionGroup">${groupOpts}</select>
                    </div>
                </div>
                `,
                { mode: 'addQuestion' }
            );
        });

        // ─── MODAL SAVE ────────────────────────────────────
        modalSave.addEventListener('click', () => {
            const mode = modalContext.mode;
            if (mode === 'addGroup') {
                const name = document.getElementById('modalGroupName')?.value.trim();
                const desc = document.getElementById('modalGroupDesc')?.value.trim();
                if (!name) { alert('Guruh nomini kiriting'); return; }
                data.groups.push({ id: genId(), name, desc: desc || '', studentIds: [] });
                saveData(data);
                closeModal();
                renderAll();
            } else if (mode === 'addStudent') {
                const name = document.getElementById('modalStudentName')?.value.trim();
                const login = document.getElementById('modalStudentLogin')?.value.trim();
                const password = document.getElementById('modalStudentPassword')?.value.trim();
                const groupId = document.getElementById('modalStudentGroup')?.value;
                if (!name || !login || !password) { alert('Barcha maydonlarni to‘ldiring'); return; }
                if (data.students.some(s => s.login === login)) { alert('Bu login band'); return; }
                const student = { id: genId(), name, login, password, groupId: groupId || null };
                data.students.push(student);
                if (groupId) {
                    const g = data.groups.find(g => g.id === groupId);
                    if (g) g.studentIds = g.studentIds || [];
                    if (g && !g.studentIds.includes(student.id)) g.studentIds.push(student.id);
                }
                saveData(data);
                closeModal();
                renderAll();
            } else if (mode === 'addQuestion') {
                const text = document.getElementById('modalQuestionText')?.value.trim();
                const maxScore = parseInt(document.getElementById('modalQuestionMax')?.value) || 10;
                const groupId = document.getElementById('modalQuestionGroup')?.value || null;
                if (!text) { alert('Savol matnini kiriting'); return; }
                data.questions.push({ id: genId(), text, maxScore, groupId });
                saveData(data);
                closeModal();
                renderAll();
            } else {
                closeModal();
            }
        });

        // ─── INIT ──────────────────────────────────────────
        // Check if already logged in? No, start with login
        loginView.style.display = 'flex';
        dashboardView.style.display = 'none';
        loginUsername.focus();

        loginBtn.addEventListener('click', login);
        loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        loginUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPassword.focus(); });

        // ─── KEYBOARD SHORTCUT: Escape to close modal ────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        console.log('✅ ILS — IT Live Score tizimi ishga tushdi');
        console.log('👤 Admin: Iroda / 009900');
        console.log('📦 Maʼlumotlar localStorage da saqlanadi');
    })();
</script>
